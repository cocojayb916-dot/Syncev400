<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calmbin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<style>
  :root{
    --primary:#FF7518;
    --primary-dim:#c75f14;
    --secondary:#000000;
    --bg:#000000;
    --bg-elev:#121212;
    --bg-elev-2:#1c1c1c;
    --border:#2a2a2a;
    --text:#ededed;
    --text-muted:#8a8a8a;
    --danger:#c0432e;
    --danger-dim:#9c3424;
    --ok:#7f9c6c;
    --radius:10px;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--sans); }
  body{ min-height:100vh; }
  a{ color:var(--primary); text-decoration:none; cursor:pointer; }
  a:hover{ text-decoration:underline; }
  button{ font-family:var(--sans); cursor:pointer; }
  input,textarea,select{ font-family:var(--sans); }
  ::selection{ background:var(--primary-dim); color:#fff; }

  .topnav{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:18px;
    padding:14px 24px;
    background:var(--secondary);
    border-bottom:1px solid var(--border);
  }
  .brand{ font-weight:700; letter-spacing:.3px; color:var(--text); font-size:17px; margin-right:8px; }
  .brand .dot{ color:var(--primary); }
  .navlink{ color:var(--text-muted); font-size:14px; padding:6px 4px; border-bottom:2px solid transparent; }
  .navlink:hover{ color:var(--text); text-decoration:none; }
  .navlink.active{ color:var(--text); border-bottom-color:var(--primary); }
  .nav-spacer{ flex:1; }
  .nav-right{ display:flex; align-items:center; gap:10px; font-size:14px; }
  .btn{
    border:1px solid var(--border); background:var(--bg-elev); color:var(--text);
    padding:7px 14px; border-radius:var(--radius); font-size:13.5px;
  }
  .btn:hover{ border-color:var(--primary-dim); }
  .btn.primary{ background:var(--primary); border-color:var(--primary); color:#1a0d00; font-weight:600; }
  .btn.primary:hover{ background:#ff8636; }
  .btn.ghost{ background:transparent; }
  .btn.danger{ border-color:var(--danger-dim); color:#ffb3a0; }
  .btn.danger:hover{ background:var(--danger-dim); color:#fff; }
  .btn.small{ padding:4px 10px; font-size:12.5px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .wrap{ max-width:880px; margin:0 auto; padding:28px 20px 80px; }
  .wrap.wide{ max-width:min(1500px, 96vw); }

  .card{
    background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px;
  }
  .stack > * + *{ margin-top:14px; }

  h1.page-title{ font-size:20px; margin:0 0 18px; font-weight:650; color:var(--text); }
  .muted{ color:var(--text-muted); }
  .small{ font-size:12.5px; }

  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label{ font-size:12.5px; color:var(--text-muted); }
  .field input[type=text], .field input[type=password], .field input[type=color], .field textarea, .field select{
    background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:9px 11px; font-size:14px; outline:none;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--primary-dim); }
  .field textarea{ resize:vertical; font-family:var(--mono); }
  .help{ font-size:11.5px; color:var(--text-muted); }
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .check{ display:flex; align-items:center; gap:7px; font-size:13px; color:var(--text-muted); }

  .alert{ padding:10px 13px; border-radius:8px; font-size:13.5px; margin-bottom:14px; }
  .alert.error{ background:#3a1610; border:1px solid var(--danger-dim); color:#ffc6b8; }
  .alert.ok{ background:#1b2a16; border:1px solid #3f5a32; color:#cfe6c2; }
  .alert.info{ background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text-muted); }

  .badge{ display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.3px; padding:1px 6px; border-radius:5px; vertical-align:1px; }
  .badge.elite{ background:rgba(255,117,24,.15); color:var(--primary); border:1px solid rgba(255,117,24,.4); }
  .badge.founder{ background:rgba(255,117,24,.9); color:#1a0d00; border:1px solid var(--primary); }
  .badge.vis{ background:transparent; color:var(--text-muted); border:1px solid var(--border); }

  .paste-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:13px 4px; border-bottom:1px solid var(--border);
  }
  .paste-row:last-child{ border-bottom:none; }
  .paste-row.pinned{ border-left:2px solid var(--primary); padding-left:12px; margin-left:-12px; }
  .paste-main{ min-width:0; }
  .paste-title{ font-size:15px; font-weight:600; }
  .paste-meta{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .paste-meta .uname{ font-weight:600; }
  .pin-flag{ color:var(--primary); font-size:11px; margin-right:6px; }
  .paste-time{ font-size:12px; color:var(--text-muted); flex-shrink:0; white-space:nowrap; }

  .empty{ color:var(--text-muted); padding:30px 4px; text-align:center; font-size:14px; }

  .paste-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
  .paste-head h1{ font-size:21px; margin:0 0 6px; word-break:break-word; }
  .paste-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .paste-content{
    font-family:var(--mono); font-size:13.5px; line-height:1.55; white-space:pre; overflow-x:auto;
    background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; max-height:75vh; overflow-y:auto;
  }
  .paste-content.htmlrender{ white-space:normal; font-family:var(--sans); }
  .mention{ color:var(--primary); font-weight:600; }

  .avatar{ width:38px; height:38px; border-radius:50%; object-fit:cover; background:var(--bg-elev-2); display:inline-flex; align-items:center; justify-content:center; font-weight:700; color:var(--text-muted); flex-shrink:0; }
  .profile-head{ display:flex; gap:16px; align-items:center; }
  .profile-head .avatar{ width:60px; height:60px; font-size:22px; }
  .profile-bio{ margin-top:14px; font-size:14px; line-height:1.6; }

  .lock-note{ font-size:11.5px; color:var(--text-muted); margin-left:6px; }

  footer.foot{ text-align:center; color:var(--text-muted); font-size:11.5px; padding:30px 0 10px; }
</style>
</head>
<body>
<div id="nav"></div>
<div id="app" class="wrap"></div>
<div id="foot"></div>

<script>
(function(){

/* ---------- storage helpers ----------
   Uses window.storage (persists for real, shared across visitors) when
   available. If it's missing or errors — e.g. the file was opened directly
   in a browser instead of inside Claude's live artifact preview — falls
   back to an in-memory store so the app still works for the current
   session (just won't survive a page refresh in that fallback mode). */
const memStore = {};
let storageWarned = false;
function memKey(key, shared){ return (shared?'shared:':'priv:')+key; }
function noteFallback(){
  if(!storageWarned){ storageWarned = true; console.warn('calmbin: persistent storage unavailable, using in-memory fallback for this session.'); }
}
async function sGet(key, shared){
  if(window.storage){
    try{ const r = await window.storage.get(key, !!shared); return r ? r.value : null; }
    catch(e){ /* missing key throws too; check memory fallback as a last resort */ }
  } else { noteFallback(); }
  const k = memKey(key, shared);
  return Object.prototype.hasOwnProperty.call(memStore, k) ? memStore[k] : null;
}
async function sSet(key, value, shared){
  if(window.storage){
    try{ const r = await window.storage.set(key, value, !!shared); if(r) return true; }
    catch(e){ console.error('storage set failed, falling back to memory', key, e); }
  } else { noteFallback(); }
  memStore[memKey(key, shared)] = value;
  return true;
}
async function sDel(key, shared){
  if(window.storage){
    try{ await window.storage.delete(key, !!shared); }
    catch(e){ /* ignore */ }
  }
  delete memStore[memKey(key, shared)];
  return true;
}
async function gJSON(key, shared){ const v = await sGet(key, shared); if(!v) return null; try{ return JSON.parse(v); }catch(e){ return null; } }
async function sJSON(key, obj, shared){ return sSet(key, JSON.stringify(obj), !!shared); }

/* ---------- crypto helpers (demo-grade, see note in chat) ---------- */
function randHex(bytes){ const a=new Uint8Array(bytes); crypto.getRandomValues(a); return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPass(password, salt){ return sha256('calmbin:'+salt+':'+password); }
function genId(){ return Date.now().toString(36)+'-'+randHex(4); }

/* ---------- formatting helpers ---------- */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function linkMentions(escaped){
  return escaped.replace(/@([a-zA-Z0-9_]{3,20})/g, (m,name)=>{
    return '<span class="mention">@'+name+'</span>';
  });
}
function renderContent(content, allowHtml){
  if(allowHtml){
    return DOMPurify.sanitize(content, {ADD_ATTR:['target']});
  }
  return linkMentions(escapeHtml(content));
}
function relTime(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<2592000) return Math.floor(s/86400)+'d ago';
  return new Date(ts).toLocaleDateString();
}
function initials(name){ return (name||'?').slice(0,1).toUpperCase(); }
function validUsername(u){ return /^[a-zA-Z0-9_]{3,20}$/.test(u); }

/* ---------- session (in-memory only; resets on reload, see chat note) ---------- */
let session = null; // { uid, username, isElite, isFounder, usernameColor, privateProfile }
const userCache = {}; // uid -> user record, cleared per render pass when needed

async function getUser(uid){
  if(userCache[uid]) return userCache[uid];
  const u = await gJSON('user:'+uid, true);
  if(u) userCache[uid] = u;
  return u;
}
function refreshSessionFromUser(u){
  session = { uid:u.uid, username:u.username, isElite:!!u.isElite, isFounder:!!u.isFounder,
    usernameColor:u.usernameColor||'', privateProfile:!!u.privateProfile };
  userCache[u.uid] = u;
}
function canModerate(){ return session && session.isFounder; }
function maxPasteLen(){ if(!session) return 20000; return (session.isElite||session.isFounder) ? 300000 : 20000; }

/* ---------- auth ---------- */
const RESERVED_FOUNDER_USERNAMES = ['coco'];

async function registerAccount(username, password){
  username = username.trim();
  if(!validUsername(username)) return {error:'Usernames must be 3-20 characters: letters, numbers, underscore.'};
  if(password.length < 4) return {error:'Password must be at least 4 characters.'};
  const lower = username.toLowerCase();
  const existing = await sGet('uname:'+lower, true);
  if(existing) return {error:'That username is already taken.'};
  const uid = 'u_'+genId();
  // Claim the username slot first, then re-read it to confirm we still hold it.
  // Storage has no true atomic compare-and-set, so this narrows (but can't fully
  // remove) the chance of two people registering the same name at the same instant.
  await sSet('uname:'+lower, uid, true);
  const holder = await sGet('uname:'+lower, true);
  if(holder !== uid) return {error:'That username was just taken by someone else. Try a different one.'};
  let count = parseInt((await sGet('meta:regcount', true)) || '0', 10);
  count += 1;
  await sSet('meta:regcount', String(count), true);
  const salt = randHex(8);
  const passHash = await hashPass(password, salt);
  const isFounder = RESERVED_FOUNDER_USERNAMES.includes(lower);
  const isElite = false; // no automatic elite rank anymore — only the founder account has elevated rank
  const user = {
    uid, username, passHash, salt, createdAt:Date.now(), order:count,
    isFounder, isElite, bio:'', bioHtml:false, avatarUrl:'', usernameColor:'',
    privateProfile:false, lastBumpAt:0, lastUsernameChangeAt:0
  };
  const ok1 = await sJSON('user:'+uid, user, true);
  if(!ok1){
    await sDel('uname:'+lower, true); // release the claim if account creation failed
    return {error:'Something went wrong creating your account. Try again.'};
  }
  refreshSessionFromUser(user);
  startPresence(uid);
  await persistSession(uid);
  return {user};
}
async function loginAccount(username, password){
  const lower = username.trim().toLowerCase();
  const uid = await sGet('uname:'+lower, true);
  if(!uid) return {error:'No account with that username.'};
  const user = await gJSON('user:'+uid, true);
  if(!user) return {error:'Account data could not be found.'};
  const hash = await hashPass(password, user.salt);
  if(hash !== user.passHash) return {error:'Incorrect password.'};
  if(RESERVED_FOUNDER_USERNAMES.includes(lower)){
    // coco is always Founder, and Founder alone (no Elite badge), regardless of past state
    if(!user.isFounder || user.isElite){
      user.isFounder = true; user.isElite = false;
      await sJSON('user:'+user.uid, user, true);
    }
  }
  refreshSessionFromUser(user);
  startPresence(uid);
  await persistSession(uid);
  return {user};
}
function logout(){
  if(session) stopPresence(session.uid);
  session = null;
  clearPersistedSession();
  route('home');
}

/* ---------- remembering who's logged in across a page refresh ----------
   Uses the artifact's personal (non-shared) storage — separate from the
   browser localStorage/sessionStorage that artifacts can't use — so the
   session is private to this browser/visitor and survives a reload. */
async function persistSession(uid){ await sSet('session:current', JSON.stringify({uid}), false); }
async function clearPersistedSession(){ await sDel('session:current', false); }
async function restoreSession(){
  const raw = await sGet('session:current', false);
  if(!raw) return false;
  try{
    const {uid} = JSON.parse(raw);
    const user = await gJSON('user:'+uid, true);
    if(!user) return false;
    refreshSessionFromUser(user);
    startPresence(uid);
    return true;
  }catch(e){ return false; }
}

/* ---------- online presence (who's logged in right now) ---------- */
let presenceHeartbeat = null;
async function loadPresence(){ return (await gJSON('presence:online', true)) || {}; }
async function savePresence(p){ return sJSON('presence:online', p, true); }
async function markOnline(uid){
  const p = await loadPresence();
  p[uid] = Date.now();
  await savePresence(p);
}
async function markOffline(uid){
  const p = await loadPresence();
  delete p[uid];
  await savePresence(p);
}
function startPresence(uid){
  markOnline(uid);
  if(presenceHeartbeat) clearInterval(presenceHeartbeat);
  presenceHeartbeat = setInterval(()=>{ if(session) markOnline(session.uid); }, 20000);
}
function stopPresence(uid){
  if(presenceHeartbeat){ clearInterval(presenceHeartbeat); presenceHeartbeat = null; }
  markOffline(uid);
}
window.addEventListener('beforeunload', ()=>{ if(session) markOffline(session.uid); });

/* ---------- paste index helpers ---------- */
async function loadIndex(){ return (await gJSON('index:pastes', true)) || []; }
async function saveIndex(idx){ return sJSON('index:pastes', idx, true); }
async function upsertIndexEntry(entry){
  const idx = await loadIndex();
  const i = idx.findIndex(e=>e.id===entry.id);
  if(i>=0) idx[i] = entry; else idx.unshift(entry);
  await saveIndex(idx);
}
async function removeIndexEntry(id){
  const idx = await loadIndex();
  await saveIndex(idx.filter(e=>e.id!==id));
}
function summaryOf(p){
  return { id:p.id, title:p.title, creatorUid:p.creatorUid, visibility:p.visibility,
    pinnedUntil:p.pinnedUntil, pinnedForever:p.pinnedForever, bumpedAt:p.bumpedAt, createdAt:p.createdAt,
    hasPassword: !!p.passHash };
}

/* ---------- paste CRUD ---------- */
async function createPaste({title, content, visibility, allowHtml, password}){
  if(!session) return {error:'You must be logged in.'};
  const elite = session.isElite || session.isFounder;
  if(!elite && visibility !== 'public') return {error:'Unlisted and private pastes are an Elite feature.'};
  if(!elite && password) return {error:'Password-protected pastes are an Elite feature.'};
  if(!elite && allowHtml) return {error:'HTML rendering is an Elite feature.'};
  if(content.length > maxPasteLen()) return {error:'Paste is too long for your account tier.'};
  const id = genId();
  let passHash = null;
  if(password){ passHash = await sha256('pastegate:'+id+':'+password); }
  const paste = {
    id, title: (title||'').trim() || 'Untitled paste', content,
    allowHtml: !!allowHtml, creatorUid: session.uid,
    visibility: visibility || 'public', passHash,
    pinnedUntil: null, pinnedForever: false,
    bumpedAt: Date.now(), createdAt: Date.now(), editedAt: null
  };
  await sJSON('paste:'+id, paste, true);
  await upsertIndexEntry(summaryOf(paste));
  return {paste};
}
async function getPaste(id){ return gJSON('paste:'+id, true); }
async function savePasteFull(p){ await sJSON('paste:'+p.id, p, true); await upsertIndexEntry(summaryOf(p)); }

async function deletePaste(id){
  const p = await getPaste(id);
  if(!p) return {error:'Paste not found.'};
  if(!session) return {error:'Not allowed.'};
  if(p.creatorUid !== session.uid && !canModerate()) return {error:'Not allowed.'};
  await sDel('paste:'+id, true);
  await removeIndexEntry(id);
  return {ok:true};
}
async function editPaste(id, newContent, newTitle){
  const p = await getPaste(id);
  if(!p) return {error:'Paste not found.'};
  const isOwner = session && p.creatorUid === session.uid;
  const ownerCanEdit = isOwner && (session.isElite || session.isFounder);
  if(!ownerCanEdit && !canModerate()) return {error:'Editing existing pastes is an Elite feature.'};
  if(newContent.length > maxPasteLen()) return {error:'Paste is too long for your account tier.'};
  p.content = newContent;
  p.title = (newTitle||'').trim() || p.title;
  p.editedAt = Date.now();
  await savePasteFull(p);
  return {paste:p};
}
async function pinPaste(id){
  const p = await getPaste(id);
  if(!p) return {error:'Paste not found.'};
  if(canModerate()){
    p.pinnedForever = true; p.pinnedUntil = null;
    await savePasteFull(p);
    return {paste:p, msg:'Pinned to the top by founder.'};
  }
  const isOwner = session && p.creatorUid === session.uid;
  if(!isOwner || !session.isElite) return {error:'Pinning pastes is an Elite feature.'};
  p.pinnedUntil = Date.now() + 100*3600*1000;
  p.pinnedForever = false;
  await savePasteFull(p);
  return {paste:p, msg:'Pinned for 100 hours.'};
}
async function unpinPaste(id){
  const p = await getPaste(id);
  if(!p) return {error:'Paste not found.'};
  const isOwner = session && p.creatorUid === session.uid;
  if(!canModerate() && !isOwner) return {error:'Not allowed.'};
  p.pinnedForever = false; p.pinnedUntil = null;
  await savePasteFull(p);
  return {paste:p};
}
async function bumpPaste(id){
  const p = await getPaste(id);
  if(!p) return {error:'Paste not found.'};
  const isOwner = session && p.creatorUid === session.uid;
  if(!isOwner || !(session.isElite || session.isFounder)) return {error:'Bumping pastes is an Elite feature.'};
  const u = await getUser(session.uid);
  const sinceLast = Date.now() - (u.lastBumpAt||0);
  if(sinceLast < 24*3600*1000 && !session.isFounder){
    const hrs = Math.ceil((24*3600*1000 - sinceLast)/3600000);
    return {error:'You can bump again in about '+hrs+'h.'};
  }
  p.bumpedAt = Date.now();
  await savePasteFull(p);
  u.lastBumpAt = Date.now();
  await sJSON('user:'+u.uid, u, true);
  userCache[u.uid] = u;
  return {paste:p, msg:'Bumped to the top of recent pastes.'};
}
async function transferPaste(id, targetUsername){
  const p = await getPaste(id);
  if(!p) return {error:'Paste not found.'};
  const isOwner = session && p.creatorUid === session.uid;
  if(!isOwner || !(session.isElite || session.isFounder)) return {error:'Transferring pastes is an Elite feature.'};
  const targetUid = await sGet('uname:'+targetUsername.trim().toLowerCase(), true);
  if(!targetUid) return {error:'No user with that username.'};
  if(targetUid === session.uid) return {error:'That is already your paste.'};
  p.creatorUid = targetUid;
  await savePasteFull(p);
  return {paste:p, msg:'Paste transferred to '+targetUsername+'.'};
}

/* ---------- account settings ---------- */
async function changeUsername(newUsername){
  const u = await getUser(session.uid);
  newUsername = newUsername.trim();
  if(!validUsername(newUsername)) return {error:'Usernames must be 3-20 characters: letters, numbers, underscore.'};
  const newLower = newUsername.toLowerCase();
  if(newLower === u.username.toLowerCase()) return {error:'That is already your username.'};
  if(!u.isElite && !u.isFounder){
    const cooldown = 14*24*3600*1000;
    const since = Date.now() - (u.lastUsernameChangeAt||0);
    if(since < cooldown){
      const days = Math.ceil((cooldown-since)/86400000);
      return {error:'You can change your username again in '+days+' day(s). Elite members can change anytime.'};
    }
  }
  const existing = await sGet('uname:'+newLower, true);
  if(existing) return {error:'That username is taken.'};
  await sDel('uname:'+u.username.toLowerCase(), true);
  await sSet('uname:'+newLower, u.uid, true);
  u.username = newUsername;
  u.lastUsernameChangeAt = Date.now();
  await sJSON('user:'+u.uid, u, true);
  refreshSessionFromUser(u);
  return {user:u};
}
async function updateProfile({bio, bioHtml, avatarUrl, usernameColor, privateProfile}){
  const u = await getUser(session.uid);
  const elite = u.isElite || u.isFounder;
  u.bio = (bio||'').slice(0,2000);
  u.bioHtml = elite ? !!bioHtml : false;
  u.avatarUrl = elite ? (avatarUrl||'').trim() : '';
  u.usernameColor = elite ? (usernameColor||'') : '';
  u.privateProfile = elite ? !!privateProfile : false;
  await sJSON('user:'+u.uid, u, true);
  refreshSessionFromUser(u);
  return {user:u};
}

/* ---------- rendering ---------- */
const app = document.getElementById('app');
const navEl = document.getElementById('nav');
const footEl = document.getElementById('foot');

function badgeFor(u){
  if(!u) return '';
  let out = '';
  if(u.isFounder) out += ' <span class="badge founder">FOUNDER</span>';
  if(u.isElite) out += ' <span class="badge elite">ELITE</span>';
  return out;
}
function unameSpan(u){
  const color = u.usernameColor ? ('style="color:'+escapeHtml(u.usernameColor)+'"') : '';
  return '<span class="uname" '+color+'>'+escapeHtml(u.username)+'</span>'+badgeFor(u);
}

function renderNav(){
  const hash = location.hash.replace('#/','') || 'home';
  const onHome = hash === 'home' || hash === '';
  const onAdd = hash === 'add';
  const onUsers = hash === 'users';
  let right = '';
  if(session){
    right = '<a class="navlink" href="#/user/'+encodeURIComponent(session.username)+'">'+escapeHtml(session.username)+'</a>'+
      '<a class="navlink" href="#/settings">Settings</a>'+
      '<button class="btn small" id="logoutBtn">Log out</button>';
  } else {
    right = '<a class="navlink" href="#/login">Log in</a>'+
      '<button class="btn small primary" onclick="location.hash=\'#/register\'">Register</button>';
  }
  navEl.innerHTML =
    '<div class="topnav">'+
      '<span class="brand">calm<span class="dot">.</span>bin</span>'+
      '<a class="navlink '+(onHome?'active':'')+'" href="#/home">Home</a>'+
      '<a class="navlink '+(onAdd?'active':'')+'" href="#/add">Add Paste</a>'+
      '<a class="navlink '+(onUsers?'active':'')+'" href="#/users">Users</a>'+
      '<div class="nav-spacer"></div>'+
      '<div class="nav-right">'+right+'</div>'+
    '</div>';
  const lo = document.getElementById('logoutBtn');
  if(lo) lo.onclick = logout;
  footEl.innerHTML = '<div class="foot">A quiet place to paste things.</div>';
}

async function renderHome(){
  app.className = 'wrap';
  app.innerHTML = '<h1 class="page-title">Recent pastes</h1><div id="feedArea"><div class="empty">Loading…</div></div>';
  const idx = await loadIndex();
  const pub = idx.filter(e=>e.visibility==='public');
  const now = Date.now();
  const pinned = pub.filter(e=>e.pinnedForever || (e.pinnedUntil && e.pinnedUntil>now));
  pinned.sort((a,b)=> (b.pinnedForever - a.pinnedForever) || (b.createdAt-a.createdAt));
  const rest = pub.filter(e=> !(e.pinnedForever || (e.pinnedUntil && e.pinnedUntil>now)));
  rest.sort((a,b)=> (b.bumpedAt||b.createdAt) - (a.bumpedAt||a.createdAt));
  const feedArea = document.getElementById('feedArea');
  if(pinned.length === 0 && rest.length === 0){
    feedArea.innerHTML = '<div class="card"><div class="empty">No pastes yet. Be the first to add one.</div></div>';
    return;
  }
  async function rowsFor(list, pinnedFlag){
    const rows = await Promise.all(list.map(async e=>{
      const u = await getUser(e.creatorUid);
      return '<div class="paste-row '+(pinnedFlag?'pinned':'')+'">'+
        '<div class="paste-main">'+
          '<div class="paste-title">'+(pinnedFlag?'<span class="pin-flag">PINNED</span>':'')+
            '<a href="#/paste/'+e.id+'">'+escapeHtml(e.title)+'</a>'+
            (e.hasPassword?' <span class="lock-note">🔒</span>':'')+
          '</div>'+
          '<div class="paste-meta">'+(u?unameSpan(u):'<span class="uname">unknown</span>')+'</div>'+
        '</div>'+
        '<div class="paste-time">'+relTime(e.createdAt)+'</div>'+
      '</div>';
    }));
    return rows.join('');
  }
  let html = '';
  if(pinned.length){
    html += '<div class="card">'+(await rowsFor(pinned, true))+'</div>';
  }
  if(rest.length){
    html += '<div class="card" style="'+(pinned.length?'margin-top:32px;':'')+'">'+(await rowsFor(rest, false))+'</div>';
  } else if(pinned.length){
    html += '<div class="empty" style="margin-top:20px;">No other pastes yet.</div>';
  }
  feedArea.innerHTML = html;
}

function renderAccountRequired(){
  app.className = 'wrap';
  app.innerHTML =
    '<div class="card" style="max-width:480px;margin:40px auto;text-align:center;">'+
      '<h1 class="page-title" style="margin-bottom:8px;">Account Required</h1>'+
      '<p class="muted">You must register or log in to add a paste.</p>'+
      '<p style="margin-top:16px;">Already have an account? <a href="#/login">Click here to log in</a></p>'+
      '<p class="small muted" style="margin-top:10px;">New here? <a href="#/register">Create an account</a></p>'+
    '</div>';
}

function renderAdd(){
  if(!session) return renderAccountRequired();
  const elite = session.isElite || session.isFounder;
  app.className = 'wrap wide';
  app.innerHTML =
    '<h1 class="page-title">Add a paste</h1>'+
    '<div class="card stack">'+
      '<div id="addErr"></div>'+
      '<div class="field"><label>Title</label><input type="text" id="ptitle" maxlength="200" placeholder="Untitled paste"></div>'+
      '<div class="field">'+
        '<label>Content</label>'+
        '<textarea id="pcontent" rows="20" style="width:100%;" placeholder="Paste your text, code, or ASCII art here…"></textarea>'+
        '<div class="help">Up to '+maxPasteLen().toLocaleString()+' characters on your account tier. Wide layout and a monospace font keep ASCII art aligned.</div>'+
      '</div>'+
      '<div class="row">'+
        '<div class="field" style="margin-bottom:0;">'+
          '<label>Visibility</label>'+
          '<select id="pvis">'+
            '<option value="public">Public — listed on Home</option>'+
            '<option value="unlisted" '+(elite?'':'disabled')+'>Unlisted — only via link'+(elite?'':' (Elite)')+'</option>'+
            '<option value="private" '+(elite?'':'disabled')+'>Private — only you'+(elite?'':' (Elite)')+'</option>'+
          '</select>'+
        '</div>'+
        '<div class="field" style="margin-bottom:0;flex:1;min-width:180px;">'+
          '<label>Password (optional'+(elite?'':', Elite feature')+')</label>'+
          '<input type="text" id="ppass" '+(elite?'':'disabled')+' placeholder="Leave blank for no password">'+
        '</div>'+
      '</div>'+
      '<div class="check"><input type="checkbox" id="phtml" '+(elite?'':'disabled')+'><label for="phtml">Render content as HTML'+(elite?'':' (Elite feature)')+'</label></div>'+
      '<div class="row"><button class="btn primary" id="submitPaste">Add paste</button></div>'+
    '</div>';
  document.getElementById('submitPaste').onclick = async ()=>{
    const title = document.getElementById('ptitle').value;
    const content = document.getElementById('pcontent').value;
    const visibility = document.getElementById('pvis').value;
    const password = document.getElementById('ppass').value;
    const allowHtml = document.getElementById('phtml').checked;
    if(!content.trim()){ showErr('addErr','Paste content cannot be empty.'); return; }
    const res = await createPaste({title, content, visibility, allowHtml, password});
    if(res.error){ showErr('addErr', res.error); return; }
    location.hash = '#/paste/'+res.paste.id;
  };
}

function showErr(id, msg){ document.getElementById(id).innerHTML = '<div class="alert error">'+escapeHtml(msg)+'</div>'; }
function showOk(id, msg){ document.getElementById(id).innerHTML = '<div class="alert ok">'+escapeHtml(msg)+'</div>'; }

function renderLogin(){
  app.className = 'wrap';
  app.innerHTML =
    '<div class="card stack" style="max-width:380px;margin:30px auto;">'+
      '<h1 class="page-title">Log in</h1>'+
      '<div id="loginErr"></div>'+
      '<div class="field"><label>Username</label><input type="text" id="lu"></div>'+
      '<div class="field"><label>Password</label><input type="password" id="lp"></div>'+
      '<button class="btn primary" id="loginBtn" style="width:100%;">Log in</button>'+
      '<p class="small muted" style="text-align:center;">No account? <a href="#/register">Register</a></p>'+
    '</div>';
  document.getElementById('loginBtn').onclick = async ()=>{
    const res = await loginAccount(document.getElementById('lu').value, document.getElementById('lp').value);
    if(res.error){ showErr('loginErr', res.error); return; }
    location.hash = '#/home';
    renderNav();
  };
}

function renderRegister(){
  app.className = 'wrap';
  app.innerHTML =
    '<div class="card stack" style="max-width:380px;margin:30px auto;">'+
      '<h1 class="page-title">Create an account</h1>'+
      '<div id="regErr"></div>'+
      '<div class="field"><label>Username</label><input type="text" id="ru"><div class="help">3–20 characters: letters, numbers, underscore.</div></div>'+
      '<div class="field"><label>Password</label><input type="password" id="rp"></div>'+
      '<button class="btn primary" id="regBtn" style="width:100%;">Register</button>'+
      '<p class="small muted" style="text-align:center;">Already registered? <a href="#/login">Log in</a></p>'+
    '</div>';
  document.getElementById('regBtn').onclick = async ()=>{
    const res = await registerAccount(document.getElementById('ru').value, document.getElementById('rp').value);
    if(res.error){ showErr('regErr', res.error); return; }
    location.hash = '#/home';
    renderNav();

async function renderPaste(id){
  app.className = 'wrap wide';
  app.innerHTML = '<div class="empty">Loading…</div>';
  const p = await getPaste(id);
  if(!p){ app.innerHTML = '<div class="card"><div class="empty">That paste does not exist or was removed.</div></div>'; return; }
  const isOwner = session && p.creatorUid === session.uid;
  const isMod = canModerate();
  if(p.visibility === 'private' && !isOwner && !isMod){
    app.innerHTML = '<div class="card"><div class="empty">This paste is private.</div></div>'; return;
  }
  const creator = await getUser(p.creatorUid);
  const elite = session && (session.isElite || session.isFounder);

  // password gate
  if(p.passHash && !isOwner && !isMod){
    app.innerHTML =
      '<div class="card stack" style="max-width:420px;margin:30px auto;">'+
        '<h1 class="page-title">'+escapeHtml(p.title)+'</h1>'+
        '<p class="muted small">This paste is password protected.</p>'+
        '<div id="gateErr"></div>'+
        '<div class="field"><label>Password</label><input type="text" id="gatePass"></div>'+
        '<button class="btn primary" id="gateBtn">View paste</button>'+
      '</div>';
    document.getElementById('gateBtn').onclick = async ()=>{
      const guess = document.getElementById('gatePass').value;
      const h = await sha256('pastegate:'+p.id+':'+guess);
      if(h === p.passHash){ renderPasteBody(p, creator, isOwner, isMod, elite); }
      else { showErr('gateErr','Incorrect password.'); }
    };
    return;
  }
  renderPasteBody(p, creator, isOwner, isMod, elite);
}

function renderPasteBody(p, creator, isOwner, isMod, elite){
  const isPinned = p.pinnedForever || (p.pinnedUntil && p.pinnedUntil > Date.now());
  let actions = '';
  if(isOwner && (session.isElite||session.isFounder)) actions += '<button class="btn small" id="editBtn">Edit</button>';
  if(isOwner || isMod) actions += '<button class="btn small danger" id="delBtn">Delete</button>';
  if((isOwner && session.isElite) || isMod){
    actions += isPinned ? '<button class="btn small" id="unpinBtn">Unpin</button>' : '<button class="btn small" id="pinBtn">Pin</button>';
  }
  if(isOwner && (session.isElite||session.isFounder)) actions += '<button class="btn small" id="bumpBtn">Bump</button>';
  if(isOwner && (session.isElite||session.isFounder)) actions += '<button class="btn small" id="transferBtn">Transfer</button>';

  app.innerHTML =
    '<div id="pasteMsg"></div>'+
    '<div class="paste-head">'+
      '<div>'+
        '<h1>'+(isPinned?'<span class="pin-flag">PINNED</span> ':'')+escapeHtml(p.title)+'</h1>'+
        '<div class="muted small">by '+(creator?unameSpan(creator):'unknown')+
          ' &middot; '+relTime(p.createdAt)+(p.editedAt?' &middot; edited '+relTime(p.editedAt):'')+
          ' &middot; <span class="badge vis">'+p.visibility+'</span>'+
        '</div>'+
      '</div>'+
      '<div class="paste-actions">'+actions+'</div>'+
    '</div>'+
    '<div class="paste-content '+(p.allowHtml?'htmlrender':'')+'">'+renderContent(p.content, p.allowHtml)+'</div>';

  const editBtn = document.getElementById('editBtn');
  if(editBtn) editBtn.onclick = ()=> renderEditForm(p);
  const delBtn = document.getElementById('delBtn');
  if(delBtn) delBtn.onclick = async ()=>{
    if(!confirm('Delete this paste? This cannot be undone.')) return;
    const r = await deletePaste(p.id);
    if(r.error){ document.getElementById('pasteMsg').innerHTML = '<div class="alert error">'+escapeHtml(r.error)+'</div>'; return; }
    location.hash = '#/home';
  };
  const pinBtn = document.getElementById('pinBtn');
  if(pinBtn) pinBtn.onclick = async ()=>{ const r = await pinPaste(p.id); if(r.error) document.getElementById('pasteMsg').innerHTML='<div class="alert error">'+escapeHtml(r.error)+'</div>'; else renderPaste(p.id); };
  const unpinBtn = document.getElementById('unpinBtn');
  if(unpinBtn) unpinBtn.onclick = async ()=>{ await unpinPaste(p.id); renderPaste(p.id); };
  const bumpBtn = document.getElementById('bumpBtn');
  if(bumpBtn) bumpBtn.onclick = async ()=>{ const r = await bumpPaste(p.id); document.getElementById('pasteMsg').innerHTML = r.error?('<div class="alert error">'+escapeHtml(r.error)+'</div>'):('<div class="alert ok">'+escapeHtml(r.msg)+'</div>'); };
  const transferBtn = document.getElementById('transferBtn');
  if(transferBtn) transferBtn.onclick = async ()=>{
    const target = prompt('Transfer this paste to which username?');
    if(!target) return;
    const r = await transferPaste(p.id, target);
    if(r.error){ document.getElementById('pasteMsg').innerHTML = '<div class="alert error">'+escapeHtml(r.error)+'</div>'; return; }
    location.hash = '#/home';
  };
}

function renderEditForm(p){
  app.className = 'wrap wide';
  app.innerHTML =
    '<h1 class="page-title">Edit paste</h1>'+
    '<div class="card stack">'+
      '<div id="editErr"></div>'+
      '<div class="field"><label>Title</label><input type="text" id="etitle" value="'+escapeHtml(p.title)+'" maxlength="200"></div>'+
      '<div class="field"><label>Content</label><textarea id="econtent" rows="20" style="width:100%;">'+escapeHtml(p.content)+'</textarea></div>'+
      '<div class="row"><button class="btn primary" id="saveEdit">Save changes</button><button class="btn ghost" id="cancelEdit">Cancel</button></div>'+
    '</div>';
  document.getElementById('saveEdit').onclick = async ()=>{
    const r = await editPaste(p.id, document.getElementById('econtent').value, document.getElementById('etitle').value);
    if(r.error){ showErr('editErr', r.error); return; }
    location.hash = '#/paste/'+p.id;
  };
  document.getElementById('cancelEdit').onclick = ()=> location.hash = '#/paste/'+p.id;
}

async function renderProfile(username){
  app.className = 'wrap';
  app.innerHTML = '<div class="empty">Loading…</div>';
  const uid = await sGet('uname:'+username.toLowerCase(), true);
  if(!uid){ app.innerHTML = '<div class="card"><div class="empty">No such user.</div></div>'; return; }
  const u = await gJSON('user:'+uid, true);
  const isSelf = session && session.uid === uid;
  if(u.privateProfile && !isSelf && !canModerate()){
    app.innerHTML = '<div class="card"><div class="profile-head">'+
      '<div class="avatar">'+initials(u.username)+'</div><div><div class="paste-title">'+unameSpan(u)+'</div><div class="muted small">This profile is private.</div></div></div></div>';
    return;
  }
  const avatar = u.avatarUrl ? '<img class="avatar" src="'+escapeHtml(u.avatarUrl)+'">' : '<div class="avatar">'+initials(u.username)+'</div>';
  const bio = u.bio ? renderContent(u.bio, u.bioHtml) : '<span class="muted">No bio yet.</span>';
  const idx = await loadIndex();
  let pastes = idx.filter(e=>e.creatorUid===uid);
  if(!isSelf && !canModerate()) pastes = pastes.filter(e=>e.visibility==='public');
  pastes.sort((a,b)=>b.createdAt-a.createdAt);
  const rows = pastes.map(e=>
    '<div class="paste-row"><div class="paste-main"><div class="paste-title"><a href="#/paste/'+e.id+'">'+escapeHtml(e.title)+'</a>'+
    (e.visibility!=='public' ? ' <span class="badge vis">'+e.visibility+'</span>' : '')+
    (e.hasPassword?' <span class="lock-note">🔒</span>':'')+
    '</div></div><div class="paste-time">'+relTime(e.createdAt)+'</div></div>'
  ).join('') || '<div class="empty">No pastes to show.</div>';

  app.innerHTML =
    '<div class="card"><div class="profile-head">'+avatar+
      '<div><div class="paste-title">'+unameSpan(u)+'</div><div class="muted small">Member since '+new Date(u.createdAt).toLocaleDateString()+'</div></div>'+
    '</div><div class="profile-bio">'+bio+'</div></div>'+
    '<h1 class="page-title" style="margin-top:24px;">Pastes</h1>'+
    '<div class="card">'+rows+'</div>';
}

const ONLINE_TIMEOUT_MS = 45000; // a user is considered online if seen within this window

async function renderUsers(){
  app.className = 'wrap';
  app.innerHTML = '<h1 class="page-title">Users online</h1><div class="card"><div class="empty">Loading…</div></div>';
  const presence = await loadPresence();
  const now = Date.now();
  const onlineUids = Object.keys(presence).filter(uid => now - presence[uid] < ONLINE_TIMEOUT_MS);
  onlineUids.sort((a,b)=> presence[b] - presence[a]);
  const card = app.querySelector('.card');
  if(onlineUids.length === 0){
    card.innerHTML = '<div class="empty">No one is logged in right now.</div>';
    return;
  }
  const rows = await Promise.all(onlineUids.map(async uid=>{
    const u = await getUser(uid);
    if(!u) return '';
    const avatar = u.avatarUrl ? '<img class="avatar" src="'+escapeHtml(u.avatarUrl)+'" style="width:28px;height:28px;">' : '<div class="avatar" style="width:28px;height:28px;font-size:12px;">'+initials(u.username)+'</div>';
    return '<div class="paste-row"><div class="paste-main" style="display:flex;align-items:center;gap:10px;">'+avatar+
      '<a href="#/user/'+encodeURIComponent(u.username)+'">'+unameSpan(u)+'</a></div>'+
      '<div class="paste-time small">online</div></div>';
  }));
  card.innerHTML = rows.join('') || '<div class="empty">No one is logged in right now.</div>';
}

function renderSettings(){
  if(!session){ location.hash = '#/login'; return; }
  app.className = 'wrap';
  getUser(session.uid).then(u=>{
    const elite = u.isElite || u.isFounder;
    app.innerHTML =
      '<h1 class="page-title">Settings</h1>'+
      '<div class="card stack">'+
        '<div class="muted small">Signed in as '+unameSpan(u)+(u.order?(' &middot; registration #'+u.order):'')+'</div>'+
        '<div id="setMsg"></div>'+
        '<div class="field"><label>Username</label><input type="text" id="suser" value="'+escapeHtml(u.username)+'">'+
          '<div class="help">'+(elite?'Elite accounts can change usernames anytime.':'Non-Elite accounts can change once every 14 days.')+' Your old username becomes available to others immediately.</div></div>'+
        '<button class="btn" id="saveUser">Update username</button>'+
      '</div>'+
      '<div class="card stack" style="margin-top:16px;">'+
        '<div class="field"><label>Bio</label><textarea id="sbio" rows="4" style="width:100%;">'+escapeHtml(u.bio||'')+'</textarea></div>'+
        '<div class="check"><input type="checkbox" id="sbiohtml" '+(u.bioHtml?'checked':'')+' '+(elite?'':'disabled')+'><label for="sbiohtml">Render bio as HTML'+(elite?'':' (Elite)')+'</label></div>'+
        '<div class="field"><label>Avatar URL (GIF supported, Elite)</label><input type="text" id="savatar" value="'+escapeHtml(u.avatarUrl||'')+'" '+(elite?'':'disabled')+'></div>'+
        '<div class="field"><label>Username color (Elite)</label><input type="color" id="scolor" value="'+(u.usernameColor||'#FF7518')+'" '+(elite?'':'disabled')+' style="width:60px;height:36px;padding:2px;"></div>'+
        '<div class="check"><input type="checkbox" id="sprivate" '+(u.privateProfile?'checked':'')+' '+(elite?'':'disabled')+'><label for="sprivate">Private profile'+(elite?'':' (Elite)')+'</label></div>'+
        '<button class="btn primary" id="saveProfile">Save profile</button>'+
      '</div>'+
      '<div class="card stack" style="margin-top:16px;">'+
        '<div class="muted small">Account tier: '+(u.isFounder?('Founder'+(u.isElite?' + Elite':'')):(u.isElite?'Elite':'Member'))+'</div>'+
      '</div>';
    document.getElementById('saveUser').onclick = async ()=>{
      const r = await changeUsername(document.getElementById('suser').value);
      if(r.error){ document.getElementById('setMsg').innerHTML='<div class="alert error">'+escapeHtml(r.error)+'</div>'; return; }
      document.getElementById('setMsg').innerHTML='<div class="alert ok">Username updated.</div>';
      renderNav();
    };
    document.getElementById('saveProfile').onclick = async ()=>{
      const r = await updateProfile({
        bio: document.getElementById('sbio').value,
        bioHtml: document.getElementById('sbiohtml').checked,
        avatarUrl: document.getElementById('savatar').value,
        usernameColor: document.getElementById('scolor').value,
        privateProfile: document.getElementById('sprivate').checked
      });
      document.getElementById('setMsg').innerHTML='<div class="alert ok">Profile saved.</div>';
    };
  });
}

/* ---------- router ---------- */
function route(){
  renderNav();
  const hash = location.hash.replace('#/','') || 'home';
  const parts = hash.split('/');
  if(parts[0]==='home' || hash===''){ renderHome(); }
  else if(parts[0]==='add'){ renderAdd(); }
  else if(parts[0]==='login'){ renderLogin(); }
  else if(parts[0]==='register'){ renderRegister(); }
  else if(parts[0]==='settings'){ renderSettings(); }
  else if(parts[0]==='users'){ renderUsers(); }
  else if(parts[0]==='paste' && parts[1]){ renderPaste(parts[1]); }
  else if(parts[0]==='user' && parts[1]){ renderProfile(decodeURIComponent(parts[1])); }
  else { renderHome(); }
}
window.addEventListener('hashchange', route);
route();

})();
